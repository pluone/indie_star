name: Sync content

# Daily: parses the 3 upstream README files straight into data/site-data.json (no intermediate
# output.json — see scripts/sync-content.mjs) and live-fetches current giscus counts too, so this
# is a fully fresh rebuild every run. Publishes the result to the `data` branch (never `main`),
# then triggers a Cloudflare Pages rebuild via its Deploy Hook.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run sync-content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-content.mjs

      - name: Prepare `data` branch worktree
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin data; then
            git worktree add --track -b data /tmp/data-branch origin/data
          else
            # First-ever run: no `data` branch yet. Branch off current HEAD, then clear
            # everything it inherited so it only ever holds the generated data going forward.
            git worktree add -b data /tmp/data-branch
            (cd /tmp/data-branch && git rm -rq . || true)
          fi

      - name: Publish data/site-data.json
        id: publish
        run: |
          mkdir -p /tmp/data-branch/data
          cp data/site-data.json /tmp/data-branch/data/site-data.json
          cd /tmp/data-branch
          git add data/site-data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync content $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.publish.outputs.changed == 'true'
        run: curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
